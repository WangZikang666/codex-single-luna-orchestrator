name: Bug report
description: Report a reproducible Single-Luna failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove secrets and private repository content.

  - type: input
    id: codex_version
    attributes:
      label: Codex version
      description: Codex Desktop/CLI version or build.
      placeholder: "e.g. Desktop build / CLI version"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Workflow mode
      options:
        - Plan Mode
        - Normal Mode
        - Both / not sure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant list_agents state and exact error text.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest safe prompt/steps that reproduce the problem.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, tokens, credentials, and private repository content.
          required: true
        - label: I checked the existing issues for duplicates.
          required: true
